<style>

:root{--bg:#eef1f5;--ink:#14213d;--line:#d9dfe8;--mute:#5b6678}
header{background:#0f1b33;border:0;padding:14px 28px;color:#fff}

.btn{background:#2b59c3;color:#fff}

.t-dir{color:#2b59c3}.t-emp{color:var(--mute)}.k-externe{color:#b7791f}.k-employe{color:#1d8a4e}.k-directeur{color:#c0392b}

<script>
const COLORS={rouge:"#d6392f",bleu:"#2a5fd0",vert:"#2e9a5b",orange:"#e08a1e"};
const KINDS={externe:"Externe",employe:"Employé",directeur:"Directeur"},KROLES={externe:["Visiteur","Prestataire","Livreur"],employe:["Employé","Stagiaire","Intérimaire"],directeur:["Directeur","Dirigeant","Chef de site"]},KCOL={externe:"bleu",employe:"vert",directeur:"rouge"};const ROLES=KROLES.externe;
const ZONES=["Bâtiment A","Bâtiment A – Étage 2","Salle 204","Atelier B","Salle serveurs (zone sensible)","Parking"];
const KEYP=crypto.subtle.importKey("raw",crypto.getRandomValues(new Uint8Array(32)),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
async function hmac(s){const b=new Uint8Array(await crypto.subtle.sign("HMAC",await KEYP,new TextEncoder().encode(s)));return [...b.slice(0,16)].map(x=>x.toString(16).padStart(2,"0")).join("")}

const clean=s=>String(s||"").replace(/[<>"'`&\\]/g,"").trim().slice(0,80);
const mail=s=>{s=String(s||"").trim().slice(0,120);return /^[\w.+-]{1,64}@[\w-]+(\.[\w-]+)+$/.test(s)?s:""};
const tel=s=>{s=String(s||"").replace(/[^\d+ ().-]/g,"").trim().slice(0,20);const n=s.replace(/\D/g,"").length;return n>=6&&n<=15?s:""};
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function pw(p,saltHex){const salt=saltHex?Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16))):crypto.getRandomValues(new Uint8Array(16));const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256);return{salt:b2h(salt),hash:b2h(bits)}}
const okUser=u=>/^[a-z0-9._-]{3,20}$/.test(u);
const okPw=p=>p.length>=10&&p.length<=100&&/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/\d/.test(p);
const tries={};
async function login(u,p){u=String(u||"").slice(0,170);const t=tries[u]||(tries[u]={n:0,until:0});if(Date.now()<t.until)return"Trop de tentatives. Réessayez dans "+Math.ceil((t.until-Date.now())/1000)+" s.";const L=accounts.filter(x=>x.nk===u);let a=null;if(!L.length)await pw(p,"00".repeat(16));for(const x of L){if(ceq((await pw(p,x.salt)).hash,x.hash)){a=x;break}}if(a){t.n=0;me=a.id;visitorId=null;view=isDir()?"cartes":"macarte";lastAct=Date.now();return""}for(const q of pending.filter(x=>x.nk===u))if(ceq((await pw(p,q.salt)).hash,q.hash))return"Inscription en attente de validation par un directeur.";if(++t.n>=5){t.until=Date.now()+30000;t.n=0}return"Identifiants incorrects."}
const ukey=(n,p)=>[n,p].map(s=>clean(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ")).join("|");
function okc(e,p){if(e&&!mail(e)){toast("E-mail invalide.");return false}if(p&&!tel(p)){toast("Numéro de téléphone invalide (6 à 15 chiffres).");return false}if(!e&&!p){toast("Indiquez un e-mail ou un téléphone.");return false}return true}
function need(){if(!isDir()){toast("Action non autorisée.");throw new Error("403")}}
const STEP=30000;
let newPhoto=null,delId=null,photoFor=null,accounts=[],me=null,aseq=1,adel=null,pending=[],authMode="login",authMsg="",seen=new Set(),fails=0,lockUntil=0,booted=false,lastAct=Date.now();
const FN_D=["Patron","Dirigeant","Responsable","Chef de site","Responsable sécurité","Directeur des ressources humaines"],FN_E=["Serveur","Femme de ménage","Couturier","Agent d’accueil","Cuisinier","Technicien","Magasinier"];let cards=[],log=[],view="cartes",visitorId=null,seq=1,lastRes=null,tick=null;

function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)}
const win=(t=Date.now())=>Math.floor(t/STEP);
const token=async(c,w=win())=>c.id+"."+w+"."+await hmac(c.id+"."+w);
function iso(h,m=0,d=0){const t=new Date();t.setDate(t.getDate()+d);t.setHours(h,m,0,0);const p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())+"T"+p(t.getHours())+":"+p(t.getMinutes())}
const fmt=s=>new Date(s).toLocaleString("fr-FR",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s).replace(/[&<>"'`]/g,c=>"&#"+c.charCodeAt(0)+";");

function seed(){
 add({name:"Camille Roche",color:"bleu",kind:"externe",email:"camille@exemple.fr",phone:"06 98 76 54 32",role:"Visiteur",mission:"Rendez-vous commercial",zones:["Bâtiment A","Salle 204"],start:iso(13),end:iso(18),max:1,channel:"E-mail",contact:"camille@exemple.fr"});
 add({name:"Atelier Dupuis SARL",color:"rouge",kind:"externe",email:"contact@dupuis.fr",phone:"06 12 34 56 78",role:"Prestataire",mission:"Maintenance des serveurs",zones:["Bâtiment A","Salle serveurs (zone sensible)"],start:iso(8),end:iso(18),max:4,channel:"SMS",contact:"06 12 34 56 78"});
}
function add(o){if(booted&&o.kind==="directeur"&&!canMakeDir()){toast("Réservé au patron et aux dirigeants.");throw new Error("403")}if(booted)need();const okd=d=>!isNaN(new Date(d));if(!okd(o.start)||!okd(o.end)||new Date(o.end)<=new Date(o.start))throw new Error("dates");const c={id:"C"+String(seq++).padStart(3,"0"),name:clean(o.name)||"Sans nom",color:Object.hasOwn(COLORS,o.color)?o.color:"bleu",role:clean(o.role),mission:clean(o.mission),zones:(o.zones||[]).filter(z=>ZONES.includes(z)),start:o.start,end:o.end,max:Math.min(999,Math.max(0,parseInt(o.max)||0)),channel:["E-mail","SMS","Lien à partager"].includes(o.channel)?o.channel:"E-mail",contact:clean(o.contact)||"–",kind:Object.hasOwn(KINDS,o.kind)?o.kind:"externe",email:mail(o.email),phone:tel(o.phone),photo:/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(o.photo||"")?o.photo:null,used:0,revoked:false};cards.unshift(c);return c}
function avatar(c,sz=44){const st=`width:${sz}px;height:${sz}px`;return c.photo?`<img class="av" src="${c.photo}" alt="" style="${st}">`:`<span class="av" style="${st};background:${COLORS[c.color]}">${esc(c.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase())}</span>`}
function readPhoto(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(i.width,i.height),cv=document.createElement("canvas");cv.width=cv.height=160;cv.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,160,160);cb(cv.toDataURL("image/jpeg",.82))};i.src=r.result};r.readAsDataURL(f)}
function stats(){const n=s=>cards.filter(c=>status(c)===s).length;const e=log.filter(l=>l.ok&&l.who!=="Admin").length;return`<div class="stats"><div class="stat"><b>${cards.length}</b><span>Cartes émises</span></div><div class="stat"><b>${n("Active")}</b><span>Actives</span></div><div class="stat"><b>${n("Révoquée")}</b><span>Révoquées</span></div><div class="stat"><b>${e}</b><span>Entrées enregistrées</span></div></div>`}
const me_=()=>accounts.find(x=>x.id===me);
const isDir=()=>{const a=me_();return !!a&&a.type==="direction"};
const canMakeDir=()=>{const a=me_();return !!a&&a.type==="direction"&&["Patron","Dirigeant"].includes(a.fonction)};
const myCardId=()=>{const a=me_();return a&&a.cardId};
function addAcc(o){if(booted&&o.type==="direction"&&!canMakeDir()){toast("Réservé au patron et aux dirigeants.");throw new Error("403")}const d=o.type==="direction";const c=add({name:o.name,color:d?"rouge":"vert",role:o.fonction,mission:d?"Direction":"Employé",zones:o.zones,start:iso(8),end:iso(18),max:0,channel:"E-mail",contact:o.email||"–",email:o.email,phone:o.phone,kind:d?"directeur":"employe",photo:o.photo});const a={id:"U"+aseq++,name:c.name,type:d?"direction":"employe",fonction:c.role,email:c.email,phone:c.phone,user:ukey(o.nom,o.prenom),nk:ukey(o.nom,""),nom:clean(o.nom),prenom:clean(o.prenom),salt:o.salt,hash:o.hash,cardId:c.id};accounts.push(a);return a}
async function seedAcc(){const L=[["Marc","Lefèvre","direction","Patron"],["Sophie","Martin","direction","Chef de site"],["Léa","Bernard","employe","Serveuse"],["Karim","Haddad","employe","Couturier"],["Nadia","Costa","employe","Femme de ménage"]];for(const [pre,nom,t,f] of L){const p=await pw("Demo2026!");addAcc({name:pre+" "+nom,nom,prenom:pre,type:t,fonction:f,...p,email:ukey(pre,"").slice(0,-1)+"@exemple.fr",phone:"06 12 34 56 "+String(10+aseq),zones:t==="direction"?ZONES:[ZONES[0]]})}}
function whoSel(){const s=document.getElementById("sess");if(!s)return;const a=me_();s.innerHTML=a?`<span style="color:#a9b6d3">${esc(a.name)} · ${esc(a.fonction)}</span><button class="btn alt" id="logout" style="color:#fff;border-color:#33466f">Se déconnecter</button>`:"";const lo=document.getElementById("logout");if(lo)lo.onclick=()=>{me=null;visitorId=null;authMsg="";render()}}
function loginView(m){const su=authMode==="signup";m.innerHTML=`<div class="panel" style="max-width:440px;margin:40px auto"><h2>${su?"Inscription":"Connexion"}</h2><p class="hint">${su?"Votre demande sera validée par un directeur avant que vous puissiez vous connecter.":"Entrez votre nom et votre mot de passe pour accéder à votre carte."}</p>
<div style="margin-bottom:12px"><label for="l-nom">Nom</label><input id="l-nom" autocomplete="family-name" maxlength="40"></div>${su?`<div style="margin-bottom:12px"><label for="l-prenom">Prénom</label><input id="l-prenom" autocomplete="given-name" maxlength="40"></div>`:""}
${su?`<div class="row"><div><label for="l-fn">Fonction</label><input id="l-fn" maxlength="80" placeholder="Ex. : serveur"></div><div><label for="l-email">E-mail</label><input id="l-email" type="email"></div><div><label for="l-phone">Téléphone</label><input id="l-phone" type="tel"></div></div>`:""}
<div style="margin-bottom:12px"><label for="l-pass">Mot de passe</label><input id="l-pass" type="password" autocomplete="${su?"new-password":"current-password"}" maxlength="100"></div>
${su?`<div style="margin-bottom:12px"><label for="l-pass2">Confirmer le mot de passe</label><input id="l-pass2" type="password" autocomplete="new-password" maxlength="100"></div><p class="hint">10 caractères minimum, avec majuscule, minuscule et chiffre.</p>`:""}
<div id="l-msg" role="alert" style="min-height:22px;margin-bottom:8px;color:${authMsg.startsWith("Demande")?"var(--ok)":"var(--ko)"}">${esc(authMsg)}</div>
<div class="actions"><button class="btn" id="l-go">${su?"Envoyer ma demande":"Se connecter"}</button><button class="btn alt" id="l-sw">${su?"J’ai déjà un compte":"Créer un compte"}</button></div>
${su?"":`<p class="hint" style="margin-top:16px">Démonstration : Lefèvre ou Martin (direction) ; Bernard, Haddad ou Costa (employés). Mot de passe : Demo2026!</p>`}</div>`;
 const g=id=>document.getElementById(id).value,msg=t=>{authMsg=t;const e=document.getElementById("l-msg");e.textContent=t;e.style.color="var(--ko)"};
 document.getElementById("l-sw").onclick=()=>{authMode=su?"login":"signup";authMsg="";render()};
 const go=async()=>{const nom=clean(g("l-nom")),pre=su?clean(g("l-prenom")):"",u=ukey(nom,pre);if(!nom||(su&&!pre))return msg(su?"Indiquez votre nom et votre prénom.":"Indiquez votre nom.");
  if(!su){msg("");const r=await login(ukey(nom,""),g("l-pass"));if(r)return msg(r);authMsg="";render();return}
  
  if(accounts.some(a=>a.user===u)||pending.some(a=>a.user===u))return msg("Un compte existe déjà à ce nom.");

  if(!okc(g("l-email"),g("l-phone")))return;
  if(!okPw(g("l-pass")))return msg("Mot de passe trop faible : 10 caractères, majuscule, minuscule et chiffre.");
  if(g("l-pass")!==g("l-pass2"))return msg("Les mots de passe ne correspondent pas.");

function status(c){const n=Date.now();if(c.revoked)return"Révoquée";if(n>new Date(c.end))return"Expirée";if(n<new Date(c.start))return"Planifiée";if(c.max&&c.used>=c.max)return"Épuisée";return"Active"}
function audit(c,zone,ok,why,who="Portique"){log.unshift({t:new Date(),cid:c?c.id:null,card:c?c.name:"Inconnu",role:c?c.role:"–",zone,ok,why,who})}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.add("hidden"),2600)}

async function verify(tok,zone){
 const [id,w,sig]=tok.split(".");const c=cards.find(x=>x.id===id);
 if(!c||!/^\d+$/.test(w||"")||!ceq(sig||"",await hmac(id+"."+w)))return{c,ok:false,why:"QR invalide ou falsifié"};
 const age=win()-Number(w);
 if(age>1||age<0)return{c,ok:false,why:"QR périmé : capture d’écran ou transfert détecté"};
 const s=status(c);
 if(s==="Révoquée")return{c,ok:false,why:"Carte révoquée"};
 if(s==="Expirée")return{c,ok:false,why:"Carte expirée à "+new Date(c.end).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
 if(s==="Planifiée")return{c,ok:false,why:"Créneau pas encore ouvert ("+fmt(c.start)+")"};
 if(s==="Épuisée")return{c,ok:false,why:"Nombre maximal d’entrées atteint"};
 if(!c.zones.includes(zone))return{c,ok:false,why:"Zone non autorisée pour cette carte"};
 if(seen.has(tok))return{c,ok:false,why:"QR déjà utilisé (rejeu bloqué)"};seen.add(tok);c.used++;return{c,ok:true,why:"Entrée "+c.used+(c.max?" sur "+c.max:"")};
}

function bind(){

 q("[data-react]",b=>b.onclick=()=>{const c=cards.find(x=>x.id===b.dataset.react);need();c.revoked=false;audit(c,"–",true,"Carte réactivée par l’administrateur","Admin");toast("Carte réactivée.");render()});

 const fp=document.getElementById("f-photo");if(fp)fp.onchange=()=>fp.files[0]&&readPhoto(fp.files[0],d=>{newPhoto=d;document.getElementById("f-prev").innerHTML=`<img src="${d}" class="av" style="width:64px;height:64px" alt="">`});
 const at=document.getElementById("a-type");

 q("[data-adel]",b=>b.onclick=()=>{const id=b.dataset.adel;if(adel!==id){adel=id;render();return}const a=accounts.find(x=>x.id===id);need();if(id===me)return;cards=cards.filter(x=>x.id!==a.cardId);accounts=accounts.filter(x=>x.id!==id);adel=null;toast("Compte et carte supprimés.");render()});
